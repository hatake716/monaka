name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android SDK 36 is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install runtime packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils dpkg patchelf binutils file unzip

      - name: Prepare Android PRoot runtime
        run: bash scripts/prepare-termux-android-proot.sh

      - name: Prepare distribution licenses and corresponding source
        run: bash scripts/prepare-distribution-legal.sh

      - name: Verify monaka source
        run: |
          # monaka（全ファイルアクセス版 / sideload 専用）の要点を検証する。
          grep -q '>monaka<' app/src/main/res/values/strings.xml
          grep -q 'StorageSettingsActivity' app/src/main/AndroidManifest.xml
          # 全ファイルアクセス権限と直接 bind mount 実装が入っていること。
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'AllFilesAccessManager' app/src/main/java/io/github/hatake716/claudecodeandroid/EmbeddedRuntimeManager.kt
          grep -q 'sharedStorageBindArgs' app/src/main/java/io/github/hatake716/claudecodeandroid/EmbeddedRuntimeManager.kt
          grep -q 'メッセージ / コマンドを入力' app/src/main/java/io/github/hatake716/claudecodeandroid/EmbeddedTerminalActivity.kt
          # Claude Code 自動インストール機能が入っていること（公式インストーラを使用）。
          grep -q 'claude.ai/install.sh' app/src/main/java/io/github/hatake716/claudecodeandroid/MainActivity.kt
          grep -q 'installClaudeCode' app/src/main/java/io/github/hatake716/claudecodeandroid/MainActivity.kt
          # SAF コピー同期は廃止済み（旧クラスが残っていないこと）。
          ! test -f app/src/main/java/io/github/hatake716/claudecodeandroid/StorageShareManager.kt
          ! test -f app/src/main/java/io/github/hatake716/claudecodeandroid/SafSyncManager.kt
          ! grep -R -q 'com.termux.permission.RUN_COMMAND' app/src/main

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify distribution APK
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug/monaka-v1.0.0-debug.apk
          test -f "$SRC"
          unzip -l "$SRC" | grep 'lib/arm64-v8a/libproot.so'
          unzip -l "$SRC" | grep 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$SRC" | grep 'lib/arm64-v8a/libandroid-shmem.so'
          unzip -l "$SRC" | grep 'lib/arm64-v8a/libtalloc.so'
          unzip -l "$SRC" | grep 'lib/arm64-v8a/libtermux.so'
          unzip -l "$SRC" | grep 'assets/legal/NOTICE.txt'
          unzip -l "$SRC" | grep 'assets/legal/licenses/GPL-2.0.txt'
          unzip -l "$SRC" | grep 'assets/legal/licenses/LGPL-3.0.txt'
          unzip -l "$SRC" | grep 'assets/legal/sources/proot-v5.1.107.92.zip'
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monaka-v1.0.0-distribution-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/monaka-v1.0.0-debug.apk
            app/build/outputs/apk/debug/monaka-v1.0.0-debug.apk.sha256
